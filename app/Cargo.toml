[package]
name = "stela-shelf-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "A stone-inspired book & wiki generator for Tomet"

[[bin]]
name = "stela-shelf"
path = "src/main.rs"

[dependencies]
stela-shelf-core = { workspace = true }
stela-shelf-webcomponents = { workspace = true, optional = true }
tomet-shelf-headless = { workspace = true }

#= Crates.io
anyhow = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[features]
default = ["all"]
all = ["webcomponents"]
webcomponents = ["dep:stela-shelf-webcomponents"]
leptos = []
htmx = []
islands = []
embedded-search = ["tomet-shelf-headless/embedded-search"]
embedded-search-extended = ["tomet-shelf-headless/embedded-search-extended"]
