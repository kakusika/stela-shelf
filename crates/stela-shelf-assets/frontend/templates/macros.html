{% macro entry_list(items) %}
<ul style="list-style-type: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 0.5rem;">
  {% for entry in items %}
  <li style="padding: 0.75rem 1rem; background: var(--surface-subtle); border: 1px solid var(--border-subtle); border-radius: 4px; display: flex; align-items: center; justify-content: space-between;">
    <a href="{{ entry.url | safe }}" style="font-weight: 500; font-size: 1rem;">{{ entry.title }}</a>
    {% if entry.section %}
    <span style="font-size: 0.8rem; color: var(--text-muted); background: var(--surface); padding: 2px 6px; border-radius: 3px; border: 1px solid var(--border-subtle);">{{ entry.section }}</span>
    {% endif %}
  </li>
  {% if entry.children %}
  <li style="padding-left: 1.5rem;">
    {{ entry_list(entry.children) }}
  </li>
  {% endif %}
  {% endfor %}
</ul>
{% endmacro %}
