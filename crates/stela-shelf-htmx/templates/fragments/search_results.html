{% if !results.is_empty() %}
<ul class="shelf-nav-list" style="background: var(--bg-surface); border: 1px solid var(--border-color); border-radius: 6px; padding: 0.5rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);">
  {% for r in results %}
  <li class="shelf-nav-item">
    <a href="{{ r.url }}" class="shelf-nav-link">
      {{ r.title }}
    </a>
  </li>
  {% endfor %}
</ul>
{% else if !query.is_empty() %}
<div style="font-size: 0.8rem; color: var(--text-muted); padding: 0.5rem;">No results found</div>
{% endif %}
