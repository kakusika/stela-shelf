[workspace]
resolver = "3"
members = ["app", "crates/*"]
default-members = ["app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
stela-shelf-core = { path = "crates/stela-shelf-core" }
stela-shelf-webcomponents = { path = "crates/stela-shelf-webcomponents" }

#= Tomet Shelf (Headless Engine & Template)
tomet-shelf-headless = { git = "https://github.com/tomet-lang/tomet-shelf.git" }
tomet-shelf-template = { git = "https://github.com/tomet-lang/tomet-shelf.git" }

#= Crates.io
anyhow = "1.0"
async-trait = "0.1"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1.42", features = ["full"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.dev.package."*"]
opt-level = 3
